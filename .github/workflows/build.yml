name: Build MiniTG

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache prebuilt TDLibFramework
        id: fwcache
        uses: actions/cache@v4
        with:
          path: third-party
          key: tdlibframework-1.8.68-c15d3f5a

      - name: Build app and package IPA
        run: |
          chmod +x build-app.sh
          bash build-app.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniTG-ipa
          path: MiniTG.ipa
          if-no-files-found: error
